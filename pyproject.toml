[project]
name = "jevgrep"
version = "0.1.0"
description = "jg: natural-language code search powered by TypeSafe's Jev decision model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.scripts]
jg = "jevgrep.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevgrep"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real TypeSafe API (needs TYPESAFE_API_KEY)"]
