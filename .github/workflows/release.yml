name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # validate artifacts only, including when dispatched on a tag

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/checks.yml

  release:
    name: publish release
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0; Node 24
        with:
          python-version: '3.12'
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 scripts/check-toolchain.py --print-package)
          test "v${version}" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1; Node 24
        with:
          pattern: jevgrep-v*
          path: dist
          merge-multiple: true
      - name: Verify complete release asset set
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -type f | wc -l | tr -d ' ')" = 6
          for target in aarch64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            archive="jevgrep-${GITHUB_REF_NAME}-${target}.tar.gz"
            test -f "dist/$archive"
            test -f "dist/$archive.sha256"
            (cd dist && sha256sum --check "$archive.sha256")
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --latest \
            --generate-notes
