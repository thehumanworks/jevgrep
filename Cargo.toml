[package]
name = "jevgrep"
version = "0.3.0"
edition = "2021"
rust-version = "1.98.1"
description = "jg: natural-language code search with Jev, ChatGPT and OpenAI-compatible decision backends"
readme = "README.md"

[[bin]]
name = "jg"
path = "src/main.rs"

[dependencies]
ignore = "0.4"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
console = "0.16.6"
indicatif = "0.18.6"
regex-lite = "0.1"
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
indicatif = { version = "0.18.6", features = ["in_memory"] }

[lints.rust]
unsafe_code = "forbid"

# Lint levels live here so `cargo clippy`, `scripts/check.sh`, and the pre-commit
# hook share one policy. CI still passes `-D warnings`, so style/complexity/perf
# from `all` stay fail-closed without a blanket pedantic or restriction group.
# See docs/adr/0006-clippy-correctness.md.
[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = "deny"
suspicious = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Pedantic / restriction / nursery: only lints that catch latent bugs in this
# crate (floats, UTF-8 slices, forgotten fields, off-by-one ranges). Cast and
# unwrap lints stay off: scores and token estimates are f64 by design, and
# tests may unwrap.
lossy_float_literal = "deny"
string_slice = "deny"
mem_forget = "deny"
get_unwrap = "deny"
undocumented_unsafe_blocks = "deny"
empty_drop = "deny"
infinite_loop = "deny"
rest_pat_in_fully_bound_structs = "deny"
deref_by_slicing = "deny"
as_ptr_cast_mut = "deny"
fn_to_numeric_cast_any = "deny"
float_cmp_const = "deny"
invalid_upcast_comparisons = "deny"
large_stack_arrays = "deny"
match_same_arms = "deny"
match_wild_err_arm = "deny"
option_option = "deny"
range_minus_one = "deny"
range_plus_one = "deny"
same_functions_in_if_condition = "deny"
inconsistent_struct_constructor = "deny"
implicit_saturating_sub = "deny"
unused_rounding = "deny"
debug_assert_with_mut_call = "deny"
suspicious_operation_groupings = "deny"
trivial_regex = "deny"
