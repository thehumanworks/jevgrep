[package]
name = "jevgrep"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.1"
description = "jg: natural-language code search with Jev, ChatGPT and OpenAI-compatible decision backends"
readme = "README.md"

[[bin]]
name = "jg"
path = "src/main.rs"

[dependencies]
ignore = "0.4"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
console = "0.16.6"
indicatif = "0.18.6"
regex-lite = "0.1"
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
indicatif = { version = "0.18.6", features = ["in_memory"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
