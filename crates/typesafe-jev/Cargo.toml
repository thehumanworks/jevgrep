[package]
name = "typesafe-jev"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Client for TypeSafe's System One API and its Jev model: calibrated answers to typed questions about JSON state, with retries, adaptive concurrency and usage accounting"
readme = "README.md"
repository = "https://github.com/thehumanworks/jevgrep"
license = "MIT OR Apache-2.0"
keywords = ["typesafe", "jev", "system-one", "api-client", "classification"]
categories = ["api-bindings"]

[dependencies]
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[lints]
workspace = true
